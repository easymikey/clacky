name: ci
on:
  pull_request:
  push:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs every check; the other systems only what is OS-dependent.
          - os: ubuntu-latest
            recipes: ""
          - os: macos-latest
            recipes: clippy clippy-no-default check
          - os: windows-latest
            recipes: clippy clippy-no-default check
    defaults:
      run:
        # `just` recipes use `sh`, and one pipes through `grep`: Git bash
        # gives the Windows runner both.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The pinned toolchain of rust-toolchain.toml, then what the justfile
      # names: nightly for fmt, the MSRV for `msrv`.
      - name: Toolchains
        run: |
          rustup toolchain install
          if [ "$RUNNER_OS" = Linux ]; then
            rustup toolchain install nightly-2026-10-30 --profile minimal --component rustfmt
            rustup toolchain install 1.85 --profile minimal
          fi
      # `cargo spellcheck` links libclang.
      - name: libclang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-bin*
            .bin
            target
          key: ${{ runner.os }}-ci-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: ${{ runner.os }}-ci-
      - name: cargo-run-bin
        run: command -v cargo-bin || cargo install cargo-run-bin --locked
      - run: cargo bin just ${{ matrix.recipes }}
      # Commit subjects: the pull request range, or the pushed range.
      - name: commit subjects (pull request)
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: cargo bin just commits ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - name: commit subjects (push)
        if: runner.os == 'Linux' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: cargo bin just commits ${{ github.event.before }}..${{ github.sha }}
