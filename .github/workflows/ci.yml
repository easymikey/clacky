name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            recipes: default
          - os: macos-15-intel
            recipes: clippy clippy-no-default check examples
          - os: windows-latest
            recipes: clippy clippy-no-default check examples
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          full: ${{ runner.os == 'Linux' }}
      - run: cargo bin just ${{ matrix.recipes }}
      - if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        run: cargo bin just commits ${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.event.pull_request.head.sha || github.sha }}
