name: release
on:
  push:
    tags: ["*-v*"]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}
jobs:
  draft:
    if: github.repository_owner == 'easymikey'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo bin just release-notes "$TAG" > notes.md
      - run: gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file notes.md
  publish:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --draft=false
