# Releases run from .github/workflows/release.yml or `just release`.
# Config reference: https://release-plz.dev/docs/config

[workspace]
# Run cargo-semver-checks and pick the bump from the API diff.
semver_check = true
# One changelog per crate, in the crate directory (the default path).
changelog_update = true
# Tag and GitHub release per crate: clacky-v0.2.0, clacky-derive-v0.2.0.
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_enable = true

[changelog]
protect_breaking_commits = true
# Conventional Commit types to the three groups; the rest stays out.
commit_parsers = [
    { message = "^(chore|ci|test|style|build|docs)", skip = true },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^(refactor|perf|revert)", group = "Changed" },
    { message = "^.*", group = "Changed" },
]
