[package]
name = "clacky"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
keywords = ["terminal", "prompt", "form", "cli", "clack"]
categories = ["command-line-interface"]
description = "Clack-style terminal prompts: one question at a time on a rail, testable, no global state"
readme = "README.md"
authors = ["Mikhail Avdeev"]
repository = "https://github.com/easymikey/clacky"
exclude = [".unlazy/", "assets/", ".github/", ".githooks/", ".config/", "justfile", "rustfmt.toml", "release-plz.toml", "rust-toolchain.toml", "spellcheck.dic", "CONTRIBUTING.md"]

[workspace]
members = ["clacky-derive"]

[lints]
workspace = true

[dependencies]
clacky-derive = { version = "=0.1.0", path = "clacky-derive", optional = true }
unicode-width = { version = "0.2", default-features = false }
tokio = { version = "1", optional = true, features = ["macros", "time"] }
unicode-segmentation = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rstest = { version = "0.28", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }

[features]
default = ["tokio"]
derive = ["dep:clacky-derive"]
fake = []
tokio = ["dep:tokio"]

[[example]]
name = "login"
required-features = ["tokio"]

[[example]]
name = "derive"
required-features = ["derive"]

[[test]]
name = "derive"
required-features = ["derive", "fake"]

[package.metadata.docs.rs]
all-features = true

[profile.size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
absolute_paths_not_starting_with_crate = "deny"
non_ascii_idents = "deny"
redundant_imports = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unstable_features = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_unsafe = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"
option_if_let_else = "deny"
needless_pass_by_ref_mut = "deny"
shadow_unrelated = "deny"
same_name_method = "deny"
unused_result_ok = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
as_conversions = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

exit = "deny"
expect_used = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"

cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

clone_on_copy = "deny"
clone_on_ref_ptr = "deny"
implicit_clone = "deny"
mem_forget = "deny"
redundant_clone = "deny"

explicit_into_iter_loop = "deny"
explicit_iter_loop = "deny"
if_not_else = "deny"
match_same_arms = "deny"
match_wildcard_for_single_variants = "deny"
needless_continue = "deny"
wildcard_imports = "deny"

empty_drop = "deny"
empty_structs_with_brackets = "deny"
fallible_impl_from = "deny"
pathbuf_init_then_push = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"

undocumented_unsafe_blocks = "deny"

missing_errors_doc = "deny"
missing_panics_doc = "deny"

disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
multiple_crate_versions = "allow"

[package.metadata.bin]
just = { version = "1.59.0", locked = true }
cargo-deny = { version = "0.20.2", locked = true }
cargo-machete = { version = "0.9.2", locked = true }
cargo-nextest = { version = "0.9.150", locked = true }
cargo-spellcheck = { version = "0.15.7", locked = true }
release-plz = { version = "0.4.3", locked = true }
cargo-semver-checks = { version = "0.51.0", locked = true }
