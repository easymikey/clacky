[package]
name = "clacky-derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
keywords = ["terminal", "prompt", "form", "cli", "derive"]
categories = ["command-line-interface"]
description = "Derive macro for clacky: enums become choices, structs become forms"
readme = "../README.md"
authors = ["Mikhail Avdeev"]
repository = "https://github.com/easymikey/clacky"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }

[lints]
workspace = true
